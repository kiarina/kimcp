[project]
name = "kimcp"
version = "0.1.0"
description = "A CLI and API gateway for managing MCP server connections"
authors = [
    { name = "kiarina", email = "kiarinadawa@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
keywords = ["mcp", "model-context-protocol", "cli", "gateway"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "langchain-core>=0.3.0",
    "langchain-mcp-adapters>=0.1.0",
    "mcp>=1.0.0",
    "platformdirs>=4.0.0",
    "psutil>=6.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pydantic-settings-manager>=3.0.0",
    "rich-click>=1.8.0",
    "uvicorn>=0.30.0",
]

[project.urls]
homepage = "https://github.com/kiarina/kimcp"
repository = "https://github.com/kiarina/kimcp"
documentation = "https://github.com/kiarina/kimcp"

[project.scripts]
kimcp = "kimcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kimcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/kimcp",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
follow_imports = "silent"
incremental = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"
fix = true

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "RUF",
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["kimcp"]

[dependency-groups]
test = [
    "pytest>=8.3.5",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=5.0.0",
]
lint = [
    "mypy>=1.14.1",
    "ruff>=0.12.1",
    "types-psutil>=7.0.0.20250822",
]
dev = [
    "mypy>=1.14.1",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.12.1",
    "types-psutil>=7.0.0.20250822",
]
